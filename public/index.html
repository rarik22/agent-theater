<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06060d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Agent Theater</title>
<meta name="description" content="A live, high-fidelity pixel-art stage of AI agents at work.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'%3E%3Crect width='8' height='8' fill='%23111a2f'/%3E%3Crect x='2' y='1' width='4' height='1' fill='%23d6672b'/%3E%3Crect x='1' y='2' width='6' height='2' fill='%23e19a73'/%3E%3Crect x='2' y='2' width='5' height='1' fill='%239a3d1d'/%3E%3Crect x='3' y='3' width='1' height='1' fill='%23316ece'/%3E%3Crect x='5' y='3' width='1' height='1' fill='%23316ece'/%3E%3Crect x='2' y='4' width='4' height='3' fill='%236744b2'/%3E%3Crect x='2' y='7' width='1' height='1' fill='%23272a3c'/%3E%3Crect x='5' y='7' width='1' height='1' fill='%23272a3c'/%3E%3C/svg%3E">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  /* one fixed screen: no scrolling, no rubber-band overscroll, no double-tap zoom or text selection (pinch zoom stays available) */
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body { position: fixed; inset: 0; background: #06060d; color: #c7cfe0; font: 15px/1.45 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  #stage { position: fixed; display: block; image-rendering: pixelated; image-rendering: crisp-edges; background: #0a0b17; }
  .stage-error { position: fixed; left: calc(16px + env(safe-area-inset-left)); bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 9; max-width: min(640px, calc(100vw - 32px)); margin: 0; padding: 10px 14px; border: 2px solid #e3474c; background: #0a0b17; color: #eaeff6; font-weight: 700; }
  .stage-error[hidden] { display: none; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

  /* an agent's log, on the stage: a panel on the right (a sheet from the bottom on a phone held upright) */
  .log { position: fixed; z-index: 5; top: calc(12px + env(safe-area-inset-top)); right: calc(12px + env(safe-area-inset-right)); bottom: calc(12px + env(safe-area-inset-bottom)); width: min(460px, 44vw); display: flex; flex-direction: column; background: #111a2f; color: #c7cfe0; border: 2px solid #33497d; box-shadow: 0 0 0 2px #06060d, 6px 6px 0 2px rgba(6, 6, 13, .85); -webkit-user-select: text; user-select: text; font: 13px/1.45 ui-monospace, "Cascadia Mono", "SF Mono", Consolas, Menlo, monospace; }
  .log[hidden] { display: none; }
  .log-head { display: flex; gap: 10px; align-items: flex-start; padding: 12px 12px 10px 14px; background: #172340; border-bottom: 2px solid #1e2c52; }
  .log-who { flex: 1; min-width: 0; }
  .log-role { margin: 0; color: #ffbd45; font: 700 15px/1.25 ui-monospace, "Cascadia Mono", "SF Mono", Consolas, Menlo, monospace; letter-spacing: .06em; text-transform: uppercase; overflow-wrap: anywhere; }
  .log-sub { margin: 4px 0 0; color: #8892b0; font-size: 12px; }
  .log-close { flex: none; width: 38px; height: 38px; border: 2px solid #33497d; background: #0e1021; color: #eaeff6; font: 700 20px/1 ui-monospace, monospace; cursor: pointer; }
  .log-close:hover, .log-close:focus-visible { border-color: #ffbd45; color: #ffbd45; outline: none; }
  .log-now { position: relative; margin: 12px 14px 4px; padding: 8px 11px; background: #eaeff6; color: #0a0b17; border: 2px solid #06060d; font-weight: 600; overflow-wrap: anywhere; }
  .log-now::after { content: ""; position: absolute; left: 18px; bottom: -8px; border: 6px solid transparent; border-top-color: #06060d; border-bottom: 0; }
  .log-now[hidden] { display: none; }
  .log-mode { margin: 8px 14px 6px; color: #6d7694; font-size: 11.5px; }
  .log-error { margin: 0 14px 8px; padding: 6px 10px; background: #320c16; color: #ff998d; }
  .log-error[hidden] { display: none; }
  .log-list { flex: 1; min-height: 0; overflow: auto; margin: 0; padding: 0 0 12px; list-style: none; border-top: 2px solid #1e2c52; overscroll-behavior: contain; }
  .log-list .e { display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 8px; padding: 7px 14px; border-bottom: 1px solid rgba(51, 73, 125, .35); }
  .log-list time { color: #6d7694; font-size: 11.5px; padding-top: 1px; }
  .log-list .text { white-space: pre-wrap; overflow-wrap: anywhere; }
  .log-list .kicker { margin-bottom: 2px; color: #ffbd45; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
  .log-list .e.say .text { color: #c6fff4; }
  .log-list .e.task .text, .log-list .e.user .text { color: #eaeff6; }
  .log-list .name { margin-right: 6px; color: #ffbd45; }
  .log-list .desc { overflow-wrap: anywhere; }
  .log-list .badge { display: inline-block; margin-left: 6px; padding: 0 5px; border: 1px solid #33497d; color: #5edcd8; font-size: 11px; }
  .log-list .dim, .log-list .note { margin-left: 8px; color: #6d7694; font-size: 11.5px; }
  .log-list .note { margin-left: 0; }
  .log-list pre { margin: 4px 0 0; padding: 6px 8px; background: #0a0b17; border-left: 2px solid #33497d; color: #a6b0c8; font: 12px/1.45 ui-monospace, "Cascadia Mono", "SF Mono", Consolas, Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
  .log-list .e.result pre { margin-top: 0; border-left-color: #1e8f60; }
  .log-list .e.result.error pre { border-left-color: #e3474c; color: #ff998d; }
  .log-list .e.notice .text, .log-list .e.stop .text { color: #9277de; font-style: italic; }
  .log-list .e.step .phrase { color: #eaeff6; }
  .log-list .e.empty, .log-list .e.note { display: block; color: #6d7694; font-style: italic; }
  .log-list .clamped { max-height: 8.8em; overflow: hidden; -webkit-mask-image: linear-gradient(#000 65%, transparent); mask-image: linear-gradient(#000 65%, transparent); }
  .log-list .more { margin-top: 4px; padding: 2px 8px; background: none; border: 1px solid #33497d; color: #6ea4f3; font: 11.5px ui-monospace, monospace; cursor: pointer; }
  .log-list .more:hover, .log-list .more:focus-visible { border-color: #6ea4f3; outline: none; }
  @media (max-width: 640px) {
    .log { top: auto; left: calc(8px + env(safe-area-inset-left)); right: calc(8px + env(safe-area-inset-right)); bottom: calc(8px + env(safe-area-inset-bottom)); width: auto; height: min(72vh, 640px); }
    .log-list .e { grid-template-columns: 56px minmax(0, 1fr); padding: 7px 12px; }
  }
  @media (max-height: 480px) and (min-width: 641px) {
    .log { top: calc(8px + env(safe-area-inset-top)); bottom: calc(8px + env(safe-area-inset-bottom)); right: calc(8px + env(safe-area-inset-right)); width: min(420px, 55vw); }
  }
  @media (prefers-reduced-motion: no-preference) {
    .log:not([hidden]) { animation: log-in .2s steps(4) both; }
    @keyframes log-in { from { transform: translateX(18px); opacity: 0; } }
  }
  /* every agent as a button, for the keyboard: hidden until focused */
  .agents { position: fixed; z-index: 6; left: calc(12px + env(safe-area-inset-left)); bottom: calc(12px + env(safe-area-inset-bottom)); display: flex; flex-wrap: wrap; gap: 6px; max-width: min(760px, calc(100vw - 24px)); padding: 8px; background: #111a2f; border: 2px solid #33497d; }
  .agents:not(:focus-within) { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0; }
  .agents button { padding: 4px 8px; background: #0e1021; color: #eaeff6; border: 1px solid #33497d; font: 12px ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace; cursor: pointer; }
  .agents button:focus-visible { outline: 2px solid #ffbd45; outline-offset: 1px; }
</style>
</head>
<body>
<canvas id="stage" role="img" aria-label="Pixel-art stage of AI agents at work"></canvas>
<div id="sr" class="sr-only" aria-live="polite"></div>
<nav id="agents" class="agents" aria-label="Agents on stage: open one's log"></nav>
<aside id="log" class="log" role="dialog" aria-label="Agent log" hidden>
  <header class="log-head">
    <div class="log-who"><h2 class="log-role">Agent</h2><p class="log-sub"></p></div>
    <button type="button" class="log-close" aria-label="Close the log">×</button>
  </header>
  <p class="log-now" hidden></p>
  <p class="log-mode"></p>
  <p class="log-error" role="alert" hidden></p>
  <ol class="log-list"></ol>
</aside>
<p id="stage-error" class="stage-error" role="alert" hidden></p>
<pre id="probe" hidden></pre>
<script>
  window.addEventListener('error', function (e) {
    var el = document.getElementById('stage-error');
    if (!el) return;
    el.hidden = false;
    el.textContent = 'The stage hit an error: ' + (e.message || 'unknown') + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : '');
  });
</script>
<script type="module" src="/hd/hd-stage.mjs"></script>
</body>
</html>
